; PlatformIO Project Configuration for Smart Socket ESP32 Firmware
; ============================================================================
; Hardware: ESP32 + 2x PZEM-004T + 2-Channel Relay + DS18B20 + MQ-2 + LCD 16x2 I2C
; Backend : Laravel 13 (smartsocket) via HiveMQ Cloud MQTT (TLS 8883)
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    ; MQTT client (PubSubClient)
    knolleary/PubSubClient@^2.8
    ; JSON
    bblanchon/ArduinoJson@^6.21.5
    ; PZEM-004T v3.0
    mandulaj/PZEM-004T-v30@^1.1.2
    ; DS18B20 (DallasTemperature + OneWire)
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    ; LCD 16x2 I2C
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Upload & monitor settings
upload_speed = 921600
board_build.partitions = default.csv
